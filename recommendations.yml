# Settings for Jev-based class recommendations (tracked in git).
# Requires TYPESAFE_API_KEY in the environment; without it, recommendations are skipped.
# Jev API: POST https://api.typesafe.ai/v1/systemone (https://docs.typesafe.ai/api)

enabled: true
model: jev-latest
threshold: 0.60            # recommend a class when the noul (P(yes)) is strictly greater than this
class_category: "Class"    # only events with this category are evaluated
max_description_chars: 1500

# The noul question asked about each class (the class title, description, and
# categories are sent as the state). Edit to change who classes are recommended to.
instructions: |
  Should this newly scheduled Dallas Makerspace class be recommended to a general
  audience of hobbyists and makers? Recommend classes that are broadly useful,
  beginner-accessible or clearly valuable, and that teach a practical making skill
  or a safety certification.

criteria:
  "true": "Broadly useful, practical making skill or safety certification, accessible to hobbyists"
  "false": "Vague, purely social, or extremely niche"
